name: karaone
n_chans: 60
duration: 5
classifier:
  n_classes: 2
  pooling: "no"
data_loader:
  dataset:
    _target_: downstream_tasks.dataloader_karaone.KaraOneDataset
    path: ${data_root}/karaone_processed
    electrodes: ['FP1', 'FPZ', 'FP2', 'AF3', 'AF4', 'F7', 'F5', 'F3', 'F1', 'FZ', 'F2', 'F4', 'F6', 'F8', 'FT7', 'FC5', 'FC3', 'FC1', 'FCZ', 'FC2', 'FC4', 'FC6', 'FT8', 'T7', 'C5', 'C3', 'C1', 'CZ', 'C2', 'C4', 'C6', 'T8', 'TP7', 'CP5', 'CP3', 'CP1', 'CPZ', 'CP2', 'CP4', 'CP6', 'TP8', 'P7', 'P5', 'P3', 'P1', 'PZ', 'P2', 'P4', 'P6', 'P8', 'PO7', 'PO5', 'PO3', 'POZ', 'PO4', 'PO6', 'PO8', 'OZ', 'O2', 'O1']
  batch_size: 32
  seed: ${seed}
linear_probing:
  n_epochs: 20
  patience: 5
  warmup_epochs: 2
  mixup: True
  dropout: 0.1
  optimizer:
    lr: 1e-4
    weight_decay: 1e-2
fine_tuning:
  n_epochs: 50
  patience: 5
  warmup_epochs: 2
  mixup: True
  dropout: 0.4
  optimizer:
    lr: 1e-4
clip: 100