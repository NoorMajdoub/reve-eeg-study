name: Yang2025 (WBCIC-SHU) Motor Imagery

n_chans: 59

duration: 7.5



classifier:

  n_classes: 2

  pooling: "no"



data_loader:

  dataset:

    _target_: downstream_tasks.dataloaders.NeuroLMDataset

    path: ${data_root}

    electrodes: ['Fpz', 'Fp1', 'Fp2', 'AF3', 'AF4', 'AF7', 'AF8', 'Fz', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'FCz', 'FC1', 'FC2', 'FC3', 'FC4', 'FC5', 'FC6', 'FT7', 'FT8', 'Cz', 'C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'T7', 'T8', 'CP1', 'CP2', 'CP3', 'CP4', 'CP5', 'CP6', 'TP7', 'TP8', 'Pz', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8', 'POz', 'PO3', 'PO4', 'PO5', 'PO6', 'PO7', 'PO8', 'Oz', 'O1', 'O2']

    scale_factor: 1.0

  batch_size: 256

  seed: ${seed}

  splits: ["train", "val", "test"]



linear_probing:

  n_epochs: 20

  patience: 5

  warmup_epochs: 5

  mixup: True

  dropout: 0.5

  optimizer:

    lr: 5e-3

    weight_decay: 1e-1



fine_tuning:

  n_epochs: 25

  patience: 11

  warmup_epochs: 5

  mixup: True

  dropout: 0.15

  optimizer:

    lr: 1e-4

clip: 100

