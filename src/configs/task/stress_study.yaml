# Mental Arithmetic (eegmat). Data settings copied unchanged from the REVE
# authors' configs/task/stress.yaml; training settings = uniform study protocol.
name: stress_study
n_chans: 20
duration: 5

classifier:
  n_classes: 2
  pooling: last

data_loader:
  dataset:
    _target_: downstream_tasks.dataloaders.LMDBDataset
    path: /lustre10/scratch/nourmaj/stress_reve_processed
    electrodes: ['FP1', 'FP2', 'F3', 'F4', 'F7', 'F8', 'T3', 'T4', 'C3', 'C4', 'T5', 'T6', 'P3', 'P4', 'O1', 'O2', 'FZ', 'CZ', 'PZ', 'A2']
    scale_factor: 1000.0
  batch_size: 32
  seed: ${seed}
  splits: ["train", "val", "test"]

linear_probing:
  n_epochs: 20
  patience: 2
  warmup_epochs: 3
  mixup: True
  optimizer:
    lr: 1e-4
    weight_decay: 1e-2

fine_tuning:
  n_epochs: 50
  patience: 2
  warmup_epochs: 5
  mixup: True
  optimizer:
    lr: 1e-4

clip: 100
