name: dream
n_chans: 257
duration: 20
classifier:
  n_classes: 2
  pooling: "no"
data_loader:
  dataset:
    _target_: downstream_tasks.dataloader_dream.DreamDataset
    path: ${data_root}/dream_processed
    positions: /scratch/nourmaj/dream_positions.npy
  batch_size: 16
  seed: ${seed}
linear_probing:
  n_epochs: 20
  patience: 5
  warmup_epochs: 2
  mixup: True
  dropout: 0.1
  optimizer:
    lr: 1e-4
    weight_decay: 1e-2
fine_tuning:
  n_epochs: 50
  patience: 5
  warmup_epochs: 2
  mixup: True
  dropout: 0.4
  optimizer:
    lr: 1e-4
clip: 100